      <title id="hf-t">Workflow Builder: drag-and-drop or click-to-create</title>
      <desc id="hf-d">The first design was a drag-and-drop canvas, which would have added three to six months to a one-quarter deadline. The team switched to a click-to-create, step-by-step builder, which shipped within the quarter and brought in 500 thousand dollars of new revenue in the first quarter after launch.</desc>

      <text x="40" y="164" class="t-l">One quarter</text>
      <text x="40" y="188" class="t-b">Workflow Builder</text>
      <text x="40" y="208" class="t">First design:</text>
      <text x="40" y="226" class="t">a drag-and-drop canvas</text>
      <path d="M200 196h26M226 94v204M226 94h26" class="d-line"/>
      <path d="M226 298h26M226 196v102M200 196h26" class="d-line-acc"/>

      <rect x="252" y="24" width="524" height="140" rx="8" class="d-box"/>
      <text x="272" y="52" class="t-lg">Drag-and-drop canvas</text>
      <text x="272" y="80" class="t-l">Time</text><text x="400" y="80" class="t">3 to 6 months extra</text>
      <text x="272" y="102" class="t-l">Engineering</text><text x="400" y="102" class="t">High effort</text>
      <text x="272" y="124" class="t-l">Admins</text><text x="400" y="124" class="t">Familiar, but easy to set up wrongly</text>
      <text x="272" y="146" class="t-l">Demo appeal</text><text x="400" y="146" class="t">Higher</text>

      <rect x="252" y="180" width="524" height="188" rx="8" class="d-acc"/>
      <text x="272" y="208" class="t-lg">Click-to-create builder</text>
      <rect x="640" y="192" width="118" height="24" rx="12" fill="rgba(220,106,106,.16)" stroke="#dc6a6a"/>
      <text x="699" y="208" text-anchor="middle" class="t-l t-acc" style="letter-spacing:.04em">Shipped</text>
      <text x="272" y="238" class="t-l">Time</text><text x="400" y="238" class="t">Within the quarter</text>
      <text x="272" y="260" class="t-l">Engineering</text><text x="400" y="260" class="t">Low effort</text>
      <text x="272" y="282" class="t-l">Admins</text><text x="400" y="282" class="t">Step by step, hard to break</text>
