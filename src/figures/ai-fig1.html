<figure class="fig" id="fig-1">
  <div class="fig-frame"><div class="fig-pad">
    <div class="ladder" role="img" aria-labelledby="ai1-t" aria-describedby="ai1-d">
      <span id="ai1-t" class="sr-only">Three stages of AI at Scrut</span>
      <span id="ai1-d" class="sr-only">Three steps from left to right. Teammates: the user asks. AI in workflows: the AI drafts and the user reviews. Agents: agents find issues and the user decides. Each stage lists what the AI does, what the user does and the main safeguard.</span>
      <div class="rung" aria-hidden="true">
        <span class="stage">Stage 1</span><h4>Scrut Teammates</h4><p class="who-line">The user asks</p><div class="rung-bar"><i style="width:33%"></i></div>
        <dl><div><dt>AI does</dt><dd>Answers compliance questions, with sources linked</dd></div><div><dt>User does</dt><dd>Asks, and checks the sources</dd></div><div class="guard"><dt>Safeguard</dt><dd>No source, no answer</dd></div></dl>
      </div>
      <div class="rung" aria-hidden="true">
        <span class="stage">Stage 2</span><h4>AI in workflows</h4><p class="who-line">AI drafts, the user reviews</p><div class="rung-bar"><i style="width:66%"></i></div>
        <dl><div><dt>AI does</dt><dd>Writes the first draft inside five everyday workflows</dd></div><div><dt>User does</dt><dd>Accepts, edits or rejects</dd></div><div class="guard"><dt>Safeguard</dt><dd>Evidence and a confidence score on every suggestion</dd></div></dl>
      </div>
      <div class="rung" aria-hidden="true">
        <span class="stage">Stage 3</span><h4>Agents</h4><p class="who-line">Agents find issues, the user decides</p><div class="rung-bar"><i style="width:100%"></i></div>
        <dl><div><dt>AI does</dt><dd>Runs all the time and brings findings when they matter</dd></div><div><dt>User does</dt><dd>Directs the agents and makes the final calls</dd></div><div class="guard"><dt>Safeguard</dt><dd>Stays quiet when unsure; a person approves anything important</dd></div></dl>
      </div>
    </div>
  </div></div>
  <figcaption><b>Figure 1</b><span>Three stages of AI at Scrut: what the AI does, what the user does, and the main safeguard at each step.</span></figcaption>
</figure>
