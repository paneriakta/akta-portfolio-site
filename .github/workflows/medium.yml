name: Refresh Medium posts
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Fetch Medium feed and rebuild public pages
        run: |
          node tools/fetch-medium.mjs
          node tools/build.mjs --public-only
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json index.html writing/index.html sitemap.xml
          git diff --cached --quiet || git commit -m "Refresh Medium posts"
          git push
